name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Include event order, storage/model mode, and relevant output without secrets.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected invariant
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit and environment
    validations:
      required: true
