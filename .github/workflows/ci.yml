name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-specs:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore FluxRisk.slnx --configfile NuGet.Config

      - name: Build
        run: dotnet build FluxRisk.slnx --configuration Release --no-restore

      - name: Run executable specifications
        run: dotnet run --project tests/FluxRisk.Specs --configuration Release --no-build --no-restore
