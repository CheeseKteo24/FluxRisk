name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-specs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fluxrisk
          POSTGRES_USER: fluxrisk
          POSTGRES_PASSWORD: fluxrisk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fluxrisk -d fluxrisk"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore FluxRisk.slnx --configfile NuGet.Config

      - name: Build
        run: dotnet build FluxRisk.slnx --configuration Release --no-restore

      - name: Run executable specifications
        run: dotnet run --project tests/FluxRisk.Specs --configuration Release --no-build --no-restore

      - name: Run PostgreSQL integration specifications
        env:
          FLUXRISK_POSTGRES: Host=127.0.0.1;Port=5432;Database=fluxrisk;Username=fluxrisk;Password=fluxrisk
        run: dotnet run --project tests/FluxRisk.PostgresSpecs --configuration Release --no-build --no-restore
