services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fluxrisk
      POSTGRES_USER: fluxrisk
      POSTGRES_PASSWORD: fluxrisk
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluxrisk -d fluxrisk"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - fluxrisk-postgres:/var/lib/postgresql/data

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.3
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - "1"
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr
      - internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr
      - internal://redpanda:8082,external://localhost:18082
    ports:
      - "18082:18082"
      - "19092:19092"
      - "19644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --exit-when-healthy"]
      interval: 3s
      timeout: 5s
      retries: 20
    volumes:
      - fluxrisk-redpanda:/var/lib/redpanda/data

  api:
    build: .
    environment:
      ConnectionStrings__FluxRisk: Host=postgres;Port=5432;Database=fluxrisk;Username=fluxrisk;Password=fluxrisk
      Redpanda__HttpProxy: http://redpanda:8082
      Redpanda__Topic: risk-decisions
      RiskModel__Mode: Shadow
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy

volumes:
  fluxrisk-postgres:
  fluxrisk-redpanda:
